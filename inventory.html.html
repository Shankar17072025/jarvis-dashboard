<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jarvis Ops Center – Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="bg-gray-100 font-sans">

  <!-- NAVBAR -->
  <nav class="bg-gradient-to-r from-blue-600 to-purple-700 p-4 text-white flex justify-between items-center shadow">
    <div class="text-xl font-bold">📊 Jarvis Ops Center</div>
    <div class="space-x-6 text-lg">
      <a href="index.html" class="hover:underline">Events</a>
      <a href="inventory.html" class="hover:underline font-bold">Inventory</a>
      <a href="logistics.html" class="hover:underline">Logistics</a>
    </div>
  </nav>

  <!-- CONTENT -->
  <main class="p-6">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-semibold text-gray-700">📦 Inventory Management</h1>
      <input type="text" id="searchInput" placeholder="🔍 Search inventory..." class="px-4 py-2 border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <table class="table-auto w-full bg-white rounded shadow overflow-hidden">
      <thead class="bg-blue-100 text-gray-700">
        <tr>
          <th class="p-3 text-left">Item</th>
          <th class="p-3 text-left">Category</th>
          <th class="p-3 text-left">Quantity</th>
          <th class="p-3 text-left">Location</th>
        </tr>
      </thead>
      <tbody id="inventory-table-body">
        <tr><td class="p-3 text-gray-400" colspan="4">Loading...</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    fetch('https://opensheet.elk.sh/1t2qqcJoHy9yElHdpZxVnvN5jlJaX38jcKxUCGi6DLvk/Inventory')
      .then(res => res.json())
      .then(data => {
        const tableBody = document.getElementById('inventory-table-body');
        tableBody.innerHTML = '';

        data.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="p-3">${row.Item}</td>
            <td class="p-3">${row.Category}</td>
            <td class="p-3">${row.Quantity}</td>
            <td class="p-3">${row.Location}</td>
          `;
          tableBody.appendChild(tr);
        });

        // Search functionality
        document.getElementById("searchInput").addEventListener("input", function () {
          const keyword = this.value.toLowerCase();
          const rows = document.querySelectorAll("#inventory-table-body tr");
          rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(keyword) ? "" : "none";
          });
        });
      })
      .catch(error => {
        document.getElementById('inventory-table-body').innerHTML = `<tr><td colspan="4" class="p-3 text-red-600">Failed to load data.</td></tr>`;
      });
  </script>

</body>
</html>
